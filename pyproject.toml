[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="aegyntra"
version="1.0.0"
description="Local-first AI agent security control plane"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","python-multipart>=0.0.9,<1","python-dotenv>=1,<2"]
[project.optional-dependencies]
test=["pytest>=8,<10","httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.setuptools.packages.find]
include=["aegyntra*"]
