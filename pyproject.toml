[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aegyntra"
version = "0.1.0"
description = "AI agent pre-execution security research prototype"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["aegyntra*"]
