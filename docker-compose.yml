services:
  aegyntra:
    build: .
    container_name: aegyntra-control-plane
    env_file: .env
    environment:
      AEGYNTRA_DATA_DIR: /app/data
      AEGYNTRA_MAX_UPLOAD_MB: "15"
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped
    networks: [default, agent_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  # After creating a Vault and importing a safe input file, generate a pairing
  # code in the dashboard and run the printed command. Only that Vault's input
  # folder is bind-mounted read-only; the agent has no host Docker socket.
  agent-runner:
    profiles: ["agent"]
    build: .
    container_name: aegyntra-demo-agent
    command: ["python", "-m", "aegyntra.runtime_agent"]
    environment:
      AEGYNTRA_API_URL: http://aegyntra:8010
      AEGYNTRA_ACCESS_CODE: ${AEGYNTRA_ACCESS_CODE:?Generate a one-time code in the dashboard first}
      AEGYNTRA_VAULT_ID: ${AEGYNTRA_VAULT_ID:?Select the Vault whose input directory is mounted}
      AEGYNTRA_WORKSPACE: /vault-input
    depends_on:
      aegyntra:
        condition: service_healthy
    volumes:
      - ./data/vaults/${AEGYNTRA_VAULT_ID:?Create a Vault first}/input:/vault-input:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    networks: [agent_internal]

networks:
  agent_internal:
    internal: true
