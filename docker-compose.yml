services:
  aegyntra:
    build: .
    container_name: aegyntra-control-plane
    env_file: .env
    environment:
      AEGYNTRA_DATA_DIR: /app/data
      AEGYNTRA_MAX_UPLOAD_MB: "15"
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - aegyntra_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped
    networks: [default, agent_internal]

  # Start only after generating a one-time code in the dashboard:
  # AEGYNTRA_ACCESS_CODE='<code>' docker compose --profile agent run --rm agent-runner
  # This is a safe deterministic test agent, not a provider-backed LLM agent.
  agent-runner:
    profiles: ["agent"]
    build: .
    container_name: aegyntra-demo-agent
    command: ["python", "-m", "aegyntra.runtime_agent"]
    environment:
      AEGYNTRA_API_URL: http://aegyntra:8010
      AEGYNTRA_ACCESS_CODE: ${AEGYNTRA_ACCESS_CODE:?Generate a one-time Vault access code in the dashboard first}
      AEGYNTRA_WORKSPACE: /workspace
    depends_on:
      - aegyntra
    volumes:
      - aegyntra_agent_workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    networks: [agent_internal]

networks:
  agent_internal:
    internal: true

volumes:
  aegyntra_data:
  aegyntra_agent_workspace:
